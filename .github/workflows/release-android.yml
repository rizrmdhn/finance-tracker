name: Release Android

on:
  push:
    tags:
      - "mobile/v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --tag-pattern "mobile/v.*" --include-path "apps/native/**" --include-path "packages/**"
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-android:
    name: Build Android
    needs: prepare
    # Run even when prepare is skipped (manual runs off a branch build without releasing).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Expo SDK 58 needs Node 22.13+; the Gradle build runs Metro through `node`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No Skia install step: since react-native-skia 2.14 the prebuilt binaries
      # ship as npm dependencies (react-native-skia-android) and the
      # install-skia CLI no longer exists.

      # --no-clean: since SDK 57, prebuild wipes android/ by default, which would
      # drop the hand-written release signingConfig and ABI splits in build.gradle.
      - name: Prebuild Android
        working-directory: apps/native
        run: bunx expo prebuild --platform android --no-clean

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/native/android/app/release.keystore

      - name: Build release APK
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/v}"
          OUT=apps/native/android/app/build/outputs/apk/release
          mv "$OUT/app-arm64-v8a-release.apk"   "$OUT/Finance-Tracker-${TAG}-arm64-v8a.apk"
          mv "$OUT/app-armeabi-v7a-release.apk"  "$OUT/Finance-Tracker-${TAG}-armeabi-v7a.apk"
          mv "$OUT/app-x86_64-release.apk"       "$OUT/Finance-Tracker-${TAG}-x86_64.apk"
          mv "$OUT/app-universal-release.apk"    "$OUT/Finance-Tracker-${TAG}-universal.apk"

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: apps/native/android/app/build/outputs/apk/release/Finance-Tracker-*.apk

  release:
    name: Create GitHub Release
    needs: [prepare, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: rizrmdhn/finance-tracker-mobile
          token: ${{ secrets.MOBILE_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: artifacts/**/*
