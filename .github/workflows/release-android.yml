name: Release Android
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release Android {0}', github.ref_name) || format('Warm Android ccache ({0})', github.ref_name) }}

on:
  push:
    tags:
      - "mobile/v*"
    # A cache saved by a tag run is scoped to that tag, so the next tag can't
    # restore it. main saves the ccache instead, and only when something that
    # changes the native (C++) compile output changes; JS-only merges skip it.
    branches:
      - main
    paths:
      - "bun.lock"
      - "apps/native/package.json"
      - "apps/native/app.json"
      - "apps/native/plugins/**"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:

# Back-to-back merges only need the newest cache build. Each tag has its own
# ref, so releases never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --tag-pattern "mobile/v.*" --include-path "apps/native/**" --include-path "packages/**"
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-android:
    name: Build Android
    needs: prepare
    # Run even when prepare is skipped (main cache builds and manual runs build
    # without releasing). Skip the cache build for the release script's version
    # bump commit: it touches app.json/package.json but not the native compile.
    if: >-
      ${{ !cancelled() && !failure() &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'build: bump')) }}
    runs-on: ubuntu-latest
    env:
      SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Expo SDK 58 needs Node 22.13+; the Gradle build runs Metro through `node`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # The per-ABI C++ (CMake) compile is the bulk of the Gradle build.
      # Tag runs only restore the cache that main saved.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache
          max-size: 1G
          save: ${{ env.SAVE_CACHE == 'true' }}
          verbose: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No Skia install step: since react-native-skia 2.14 the prebuilt binaries
      # ship as npm dependencies (react-native-skia-android) and the
      # install-skia CLI no longer exists.

      # android/ is generated, not committed: release signing, ABI splits and the
      # ABI list come from apps/native/plugins/with-android-release.js.
      - name: Prebuild Android
        working-directory: apps/native
        run: bunx expo prebuild --platform android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/native/android/app/release.keystore

      - name: Build release APK
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # CMake (>= 3.17) reads these from the environment, so every native
          # module compiles through ccache without touching its build.gradle.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros

      - name: Rename APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/v}"
          OUT=apps/native/android/app/build/outputs/apk/release
          mv "$OUT/app-arm64-v8a-release.apk"   "$OUT/Finance-Tracker-${TAG}-arm64-v8a.apk"
          mv "$OUT/app-armeabi-v7a-release.apk"  "$OUT/Finance-Tracker-${TAG}-armeabi-v7a.apk"
          mv "$OUT/app-universal-release.apk"    "$OUT/Finance-Tracker-${TAG}-universal.apk"

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: apps/native/android/app/build/outputs/apk/release/Finance-Tracker-*.apk

  release:
    name: Create GitHub Release
    needs: [prepare, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: rizrmdhn/finance-tracker-mobile
          token: ${{ secrets.MOBILE_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: artifacts/**/*
