name: Android
# Tag pushes release; main pushes only build to warm the caches for the next tag.
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release Android {0}', github.ref_name) || format('Warm Android build cache ({0})', github.ref_name) }}

on:
  push:
    tags:
      - "mobile/v*"
    # Caches saved by a tag run are scoped to that tag, so the next tag can't
    # read them. Builds on main save the caches instead; tag runs restore them.
    branches:
      - main
    paths:
      - "apps/native/**"
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:

permissions:
  contents: write

# Several merges in a row only need the newest cache build, so a new main push
# cancels the one still running. Each tag has its own ref, so releases never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  prepare:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --tag-pattern "mobile/v.*"
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build-android:
    name: Build Android
    needs: prepare
    # Run even when prepare is skipped (main-branch cache builds).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Caches Gradle dependencies + build cache; writes only from main.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ env.SAVE_CACHE != 'true' }}

      # The C++ (CMake) compile for every ABI is most of the build time.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ccache
          max-size: 2G
          save: ${{ env.SAVE_CACHE == 'true' }}
          verbose: 1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Restore bun cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Save bun cache
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install Skia binaries
        run: bunx install-skia
        working-directory: apps/native

      - name: Prebuild Android
        working-directory: apps/native
        run: bunx expo prebuild --platform android

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/native/android/app/release.keystore

      - name: Build release APK
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # CMake (>= 3.17) reads these from the environment, so every native
          # module compiles through ccache without touching its build.gradle.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros

      - name: Rename APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/mobile/v}"
          OUT=apps/native/android/app/build/outputs/apk/release
          mv "$OUT/app-arm64-v8a-release.apk"   "$OUT/Finance-Tracker-${TAG}-arm64-v8a.apk"
          mv "$OUT/app-armeabi-v7a-release.apk"  "$OUT/Finance-Tracker-${TAG}-armeabi-v7a.apk"
          mv "$OUT/app-x86_64-release.apk"       "$OUT/Finance-Tracker-${TAG}-x86_64.apk"
          mv "$OUT/app-universal-release.apk"    "$OUT/Finance-Tracker-${TAG}-universal.apk"

      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: apps/native/android/app/build/outputs/apk/release/Finance-Tracker-*.apk

  release:
    name: Create GitHub Release
    needs: [prepare, build-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: rizrmdhn/finance-tracker-mobile
          token: ${{ secrets.MOBILE_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: artifacts/**/*
