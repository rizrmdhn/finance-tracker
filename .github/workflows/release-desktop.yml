name: Release Desktop

on:
  push:
    tags:
      - "desktop/v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --tag-pattern "desktop/v.*" --include-path "apps/desktop/**" --include-path "packages/**"
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Detect pre-release
        id: prerelease
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/desktop/}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: |
              apps/desktop/dist/**/*.exe
              apps/desktop/dist/*.yml
              !apps/desktop/dist/builder-debug.yml
          - os: macos-latest
            args: --mac
            artifact: |
              apps/desktop/dist/**/*.dmg
              apps/desktop/dist/*.yml
              !apps/desktop/dist/builder-debug.yml
          - os: ubuntu-latest
            args: --linux
            artifact: |
              apps/desktop/dist/**/*.AppImage
              apps/desktop/dist/*.yml
              !apps/desktop/dist/builder-debug.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      # No bun cache: a cache saved by a tag run is scoped to that tag, so the
      # next release can't restore it, and a cold `bun install` takes seconds.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Electron 42+ no longer downloads its binary on install; electron-builder
      # packages from node_modules/electron/dist (ELECTRON_OVERRIDE_DIST_PATH below).
      - name: Install Electron binary
        run: bunx install-electron --no

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: apps/desktop/release-notes

      # electron-updater shows latest.yml's releaseNotes as HTML. Without them it
      # falls back to the repo's releases.atom feed, which also lists mobile/v*
      # tags and so shows the wrong notes.
      - name: Convert release notes to HTML
        run: bunx marked@15.0.12 -i release-notes/RELEASE_NOTES.md -o release-notes/RELEASE_NOTES.html
        working-directory: apps/desktop

      # bash: PowerShell splits the `-c.releaseInfo...` argument at the dot.
      - name: Build & package desktop
        shell: bash
        run: bun run build && bunx electron-builder ${{ matrix.args }} --publish never -c.releaseInfo.releaseNotesFile=release-notes/RELEASE_NOTES.html
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/node_modules/electron/dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "desktop-*"
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: artifacts/**/*
